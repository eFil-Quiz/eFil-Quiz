<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizify Pro — Викторины для друзей</title>
    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Плавная анимация появления (Fade-in & Scale) */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.99);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-fade-in {
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex justify-center items-center min-h-screen p-4">

<div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl max-w-xl w-full p-8 relative overflow-hidden transition-all">
    
    <!-- ВЕРХНЯЯ ПАНЕЛЬ АВТОРИЗАЦИИ -->
    <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800 text-sm text-slate-400">
        <span id="user-email-display" class="font-medium text-slate-300">Не авторизован</span>
        <button id="logout-btn" onclick="logout()" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 px-3 py-1.5 rounded-lg hover:bg-red-500/20 transition-all text-xs font-semibold">
            Выйти
        </button>
    </div>

    <!-- АВТОРИЗАЦИЯ -->
    <div id="auth-screen" class="animate-fade-in">
        <h2 class="text-2xl font-bold mb-2">Вход на платформу 🔐</h2>
        <p class="text-slate-400 text-sm mb-6">Введите почту и пароль для участия в викторинах.</p>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Email</label>
                <input type="email" id="auth-email" placeholder="email@example.com" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 focus:outline-none focus:border-indigo-500 transition-all">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Пароль</label>
                <input type="password" id="auth-password" placeholder="••••••••" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 focus:outline-none focus:border-indigo-500 transition-all">
            </div>
            <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-indigo-600/20">
                Войти / Зарегистрироваться
            </button>
        </div>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="home-screen" class="hidden animate-fade-in">
        <h1 class="text-2xl font-bold mb-1">Доступные викторины 🎯</h1>
        <p class="text-slate-400 text-sm mb-6">Выберите интересную викторину из списка и проверьте свои силы!</p>
        
        <div id="quiz-list" class="space-y-3 max-h-72 overflow-y-auto pr-1"></div>
        
        <!-- Панель администратора (видна только тебе) -->
        <div id="admin-controls" class="hidden mt-6 pt-5 border-t border-slate-800">
            <p class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3">Панель организатора</p>
            <div class="space-y-2.5">
                <button onclick="showScreen('creator-screen')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2">
                    ✨ Создать новую викторину
                </button>
                <button onclick="openOrganizerDashboard()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-3 rounded-xl transition-all border border-slate-700">
                    📊 Панель организатора
                </button>
            </div>
        </div>
    </div>

    <!-- КОНСТРУКТОР ВИКТОРИН -->
    <div id="creator-screen" class="hidden animate-fade-in">
        <h2 class="text-xl font-bold mb-4">Конструктор викторины</h2>
        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-400 mb-1">Название викторины</label>
            <input type="text" id="quiz-title-input" placeholder="Например: Исторический квиз" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 focus:outline-none focus:border-indigo-500">
        </div>
        
        <div id="questions-container" class="space-y-4 max-h-64 overflow-y-auto pr-1 mb-4">
            <div class="question-block bg-slate-950/50 border border-slate-800 p-4 rounded-2xl space-y-3">
                <div class="flex justify-between items-center"><span class="text-xs font-bold text-slate-400">Вопрос 1</span></div>
                <input type="text" class="q-text w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="Текст вопроса">
                
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Категория</label>
                    <select class="q-cat w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                        <option value="История">История</option>
                        <option value="Кино/Сериалы">Кино/Сериалы</option>
                        <option value="Музыка">Музыка</option>
                        <option value="Литература">Литература</option>
                        <option value="Спорт">Спорт</option>
                        <option value="Мода и стиль">Мода и стиль</option>
                        <option value="Автомобили">Автомобили</option>
                        <option value="Астрономия">Астрономия</option>
                        <option value="Русский язык">Русский язык</option>
                        <option value="Анатомия">Анатомия</option>
                        <option value="Пословицы/Поговорки">Пословицы/Поговорки</option>
                        <option value="СССР">СССР</option>
                        <option value="Общие" selected>Общие</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Ссылка на медиа (картинка, видео, аудио .mp3)</label>
                    <input type="text" class="q-media w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="https://example.com/image.jpg">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <input type="text" class="opt-0 px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="Вариант 1">
                    <input type="text" class="opt-1 px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="Вариант 2">
                    <input type="text" class="opt-2 px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="Вариант 3">
                    <input type="text" class="opt-3 px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="Вариант 4">
                </div>

                <div class="flex items-center gap-2">
                    <label class="text-xs text-slate-400">Правильный вариант (1-4):</label>
                    <input type="number" class="q-correct w-16 px-2 py-1 bg-slate-900 border border-slate-800 rounded-lg text-sm text-center text-slate-100" min="1" max="4" value="1">
                </div>
            </div>
        </div>

        <button onclick="addQuestionField()" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold py-2.5 rounded-xl transition-all text-sm mb-2">
            ➕ Добавить вопрос
        </button>
        <button onclick="saveQuizToSupabase()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/20">
            💾 Сохранить в облако
        </button>
        <button onclick="showScreen('home-screen')" class="w-full mt-2 text-slate-400 hover:text-slate-200 py-2 text-sm transition-all">
            ← Назад
        </button>
    </div>

    <!-- ПРОХОЖДЕНИЕ ВИКТОРИНЫ -->
    <div id="play-screen" class="hidden animate-fade-in">
        <div class="flex justify-between items-center text-xs text-slate-400 mb-4 font-medium">
            <span id="q-counter" class="bg-slate-800 px-2.5 py-1 rounded-md">Вопрос 1/1</span>
            <span id="q-timer" class="bg-slate-800 px-2.5 py-1 rounded-md">⏱️ 0с</span>
        </div>
        
        <div id="media-container" class="mb-4 flex justify-center"></div>
        <h2 id="q-title" class="text-lg font-bold mb-4 text-slate-100">Загрузка...</h2>
        
        <div id="q-options" class="space-y-3"></div>
        <button id="next-q-btn" class="hidden w-full mt-5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/20 animate-fade-in" onclick="nextQuestion()">
            Следующий вопрос ➡️
        </button>
    </div>

    <!-- ЭКРАН РЕЗУЛЬТАТОВ -->
    <div id="result-screen" class="hidden animate-fade-in">
        <h2 class="text-2xl font-bold mb-1">Итоги викторины! 🎉</h2>
        <p id="res-summary" class="text-sm font-semibold text-indigo-400 mb-4"></p>
        
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Ваши ответы:</h3>
        <div class
