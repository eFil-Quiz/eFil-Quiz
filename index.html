        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .app-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); max-width: 750px; width: 100%; padding: 30px; position: relative; }
        h1, h2, h3 { font-weight: 700; margin-bottom: 12px; }
        p { color: var(--text-muted); font-size: 15px; line-height: 1.5; }

        .btn:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: transparent; color: var(--text-main); border: 1px solid var(--border); }
        .btn-danger { background-color: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); width: auto; padding: 6px 12px; font-size: 14px; margin: 0; }
        .hidden { display: none !important; }

        input:focus, select:focus { border-color: var(--primary); }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
