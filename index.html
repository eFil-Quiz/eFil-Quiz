<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizify — Викторины с аналитикой</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            max-width: 650px;
            width: 100%;
            padding: 30px;
            position: relative;
        }

        h1, h2, h3 {
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.5;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        .btn-secondary { background-color: transparent; color: var(--text-main); border: 1px solid var(--border); box-shadow: none; }
        .btn-secondary:hover { background-color: rgba(255, 255, 255, 0.05); }
        .btn-danger { background-color: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); width: auto; padding: 8px 16px; font-size: 14px; margin: 0; box-shadow: none; }
        .btn-danger:hover { background-color: var(--danger); color: white; }

        .hidden { display: none !important; }

        /* Списки и карточки */
        .quiz-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .quiz-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            padding: 16px 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
        }
        input:focus { border-color: var(--primary); }

        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
        .question-block {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 16px;
        }

        /* Прохождение */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .option-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            font-weight: 500;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background: rgba(99, 102, 241, 0.05); }
        .option-btn.correct { background: rgba(34, 197, 94, 0.2); border-color: var(--success); color: #4ade80; }
        .option-btn.incorrect { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: #f87171; }

        .timer-box {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        /* Таблица результатов */
        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 14px;
        }
        .results-table th, .results-table td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: center;
        }
        .results-table th { background: rgba(15, 23, 42, 0.8); }
        .badge-green { color: var(--success); font-weight: bold; }
        .badge-red { color: var(--danger); font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="home-screen">
        <h1>Викторины для друзей 🎯</h1>
        <p>Пройди тест, узнай свои результаты и время прохождения!</p>
        <div class="quiz-list" id="quiz-list"></div>
        <button class="btn" onclick="showScreen('creator-screen')">✨ Создать свою викторину</button>
    </div>

    <!-- ВВОД ИМЕНИ ПЕРЕД СТАРТОМ -->
    <div id="name-screen" class="hidden">
        <h2>Представься, участник 👋</h2>
        <p>Введите ваше Имя и Фамилию, чтобы организатор видел ваши результаты.</p>
        <input type="text" id="participant-name" placeholder="Например: Иван Иванов">
        <button class="btn" onclick="startQuizProcess()">Начать викторину 🚀</button>
        <button class="btn btn-secondary" onclick="showScreen('home-screen')">Назад</button>
    </div>

    <!-- КОНСТРУКТОР -->
    <div id="creator-screen" class="hidden">
        <h2>Конструктор викторины</h2>
        <label>Название викторины</label>
        <input type="text" id="quiz-title-input" placeholder="Например: Насколько хорошо ты меня знаешь?">
        
        <div id="questions-container" style="max-height: 280px; overflow-y: auto; padding-right: 4px;">
            <div class="question-block">
                <label>Вопрос 1</label>
                <input type="text" class="q-text" placeholder="Текст вопроса">
                <input type="text" class="opt-0" placeholder="Вариант 1">
                <input type="text" class="opt-1" placeholder="Вариант 2">
                <input type="text" class="opt-2" placeholder="Вариант 3">
                <input type="text" class="opt-3" placeholder="Вариант 4">
                <label>Правильный вариант (1 - 4):</label>
                <input type="number" class="q-correct" min="1" max="4" value="1">
            </div>
        </div>

        <button class="btn btn-secondary" onclick="addQuestionField()">➕ Добавить вопрос</button>
        <button class="btn" onclick="saveQuiz()">💾 Сохранить</button>
        <button class="btn btn-secondary" onclick="showScreen('home-screen')">← Назад</button>
    </div>

    <!-- ПРОХОЖДЕНИЕ -->
    <div id="play-screen" class="hidden">
        <div class="timer-box">
            <span id="question-counter">Вопрос 1/1</span>
            <span id="question-timer">⏱️ Время на вопрос: 0с</span>
        </div>
        <h2 id="question-title" style="font-size: 20px; margin-bottom: 15px;">Загрузка...</h2>
        <div id="play-options" class="options-container"></div>
        <button id="next-btn" class="btn hidden" onclick="nextQuestion()">Следующий вопрос ➡️</button>
    </div>

    <!-- РЕЗУЛЬТАТЫ И СВОДНАЯ ТАБЛИЦА -->
    <div id="result-screen" class="hidden">
        <h2>Итоги прохождения 🎉</h2>
        <p id="participant-greeting" style="font-weight: 600; color: #f8fafc; margin-bottom: 10px;"></p>
        <p id="total-time-text" style="margin-bottom: 15px;"></p>
        
        <div style="max-height: 250px; overflow-y: auto;">
            <table class="results-table">
                <thead>
                    <tr>
                        <th>№</th>
                        <th>Вопрос</th>
                        <th>Ответ</th>
                        <th>Время</th>
                    </tr>
                </thead>
                <tbody id="results-table-body"></tbody>
            </table>
        </div>

        <button class="btn" onclick="showScreen('home-screen')" style="margin-top: 20px;">На главную</button>
    </div>
</div>

<script>
    let quizzes = JSON.parse(localStorage.getItem('my_quizzes')) || [
        {
            title: "Тестовая викторина 🧠",
            questions: [
                { question: "Сколько будет 2 + 2 * 2?", options: ["6", "8", "4", "2"], correct: 0 }
            ]
        }
    ];

    let currentQuizIndex = null;
    let currentQuestionIndex = 0;
    let participantName = "";
    let questionStartTime = 0;
    let totalStartTime = 0;
    let timerInterval = null;
    
    // Сбор статистики текущего прохождения
    let sessionResults = [];

    function showScreen(screenId) {
        ['home-screen', 'name-screen', 'creator-screen', 'play-screen', 'result-screen'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById(screenId).classList.remove('hidden');
        if (screenId === 'home-screen') renderQuizList();
    }

    function renderQuizList() {
        const container = document.getElementById('quiz-list');
        container.innerHTML = '';
        if (quizzes.length === 0) {
            container.innerHTML = '<p style="text-align:center;">Пока нет викторин.</p>';
            return;
        }
        quizzes.forEach((quiz, index) => {
            const div = document.createElement('div');
            div.className = 'quiz-item';
            div.innerHTML = `
                <div><h3>${quiz.title}</h3><span>Вопросов: ${quiz.questions.length}</span></div>
                <div style="display:flex; gap:8px;">
                    <button class="btn" style="width:auto; padding:8px 16px; margin:0; font-size:14px;" onclick="prepareQuiz(${index})">Пройти</button>
                    <button class="btn btn-danger" onclick="deleteQuiz(${index})">Удалить</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function prepareQuiz(index) {
        currentQuizIndex = index;
        showScreen('name-screen');
    }

    function startQuizProcess() {
        const nameInput = document.getElementById('participant-name').value.trim();
        if (!nameInput) {
            alert('Пожалуйста, введите ваше имя!');
            return;
        }
        participantName = nameInput;
        currentQuestionIndex = 0;
        sessionResults = [];
        totalStartTime = Date.now();
        showScreen('play-screen');
        loadQuestion();
    }

    function addQuestionField() {
        const container = document.getElementById('questions-container');
        const count = container.getElementsByClassName('question-block').length + 1;
        const block = document.createElement('div');
        block.className = 'question-block';
        block.innerHTML = `
            <label>Вопрос ${count}</label>
            <input type="text" class="q-text" placeholder="Текст вопроса">
            <input type="text" class="opt-0" placeholder="Вариант 1">
            <input type="text" class="opt-1" placeholder="Вариант 2">
            <input type="text" class="opt-2" placeholder="Вариант 3">
            <input type="text" class="opt-3" placeholder="Вариант 4">
            <label>Правильный вариант (1 - 4):</label>
            <input type="number" class="q-correct" min="1" max="4" value="1">
        `;
        container.appendChild(block);
    }

    function saveQuiz() {
        const title = document.getElementById('quiz-title-input').value.trim();
        if (!title) { alert('Введите название!'); return; }
        const blocks = document.getElementsByClassName('question-block');
        const questions = [];
        for (let block of blocks) {
            const qText = block.getElementsByClassName('q-text')[0].value.trim();
            const opts = [
                block.getElementsByClassName('opt-0')[0].value.trim(),
                block.getElementsByClassName('opt-1')[0].value.trim(),
                block.getElementsByClassName('opt-2')[0].value.trim(),
                block.getElementsByClassName('opt-3')[0].value.trim()
            ];
            const correct = parseInt(block.getElementsByClassName('q-correct')[0].value) - 1;
            if (!qText || opts.some(o => !o)) { alert('Заполните все поля!'); return; }
            questions.push({ question: qText, options: opts, correct: correct });
        }
        quizzes.push({ title, questions });
        localStorage.setItem('my_quizzes', JSON.stringify(quizzes));
        showScreen('home-screen');
    }

    function deleteQuiz(index) {
        if (confirm('Удалить викторину?')) {
            quizzes.splice(index, 1);
            localStorage.setItem('my_quizzes', JSON.stringify(quizzes));
            renderQuizList();
        }
    }

    function loadQuestion() {
        const quiz = quizzes[currentQuizIndex];
        const q = quiz.questions[currentQuestionIndex];
        
        document.getElementById('question-counter').innerText = `Вопрос ${currentQuestionIndex + 1} из ${quiz.questions.length}`;
        document.getElementById('question-title').innerText = q.question;
        document.getElementById('next-btn').classList.add('hidden');

        let seconds = 0;
        questionStartTime = Date.now();
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            seconds++;
            document.getElementById('question-timer').innerText = `⏱️ Время: ${seconds}с`;
        }, 1000);

        const container = document.getElementById('play-options');
        container.innerHTML = '';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(idx, btn);
            container.appendChild(btn);
        });
    }

    function selectAnswer(selectedIndex, selectedBtn) {
        clearInterval(timerInterval);
        const timeSpent = ((Date.now() - questionStartTime) / 1000).toFixed(1);
        const quiz = quizzes[currentQuizIndex];
        const correctIndex = quiz.questions[currentQuestionIndex].correct;
        const isCorrect = (selectedIndex === correctIndex);

        // Подсветка правильного и неправильного
        const buttons = document.getElementsByClassName('option-btn');
        for (let i = 0; i < buttons.length; i++) {
            buttons[i].disabled = true;
            if (i === correctIndex) buttons[i].classList.add('correct');
            if (i === selectedIndex && !isCorrect) buttons[i].classList.add('incorrect');
        }

        // Записываем результат вопроса
        sessionResults.push({
            question: quiz.questions[currentQuestionIndex].question,
            isCorrect: isCorrect,
            time: timeSpent
        });

        // Показываем кнопку далее
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
        currentQuestionIndex++;
        const quiz = quizzes[currentQuizIndex];
        if (currentQuestionIndex < quiz.questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        showScreen('result-screen');
        const totalTimeSec = ((Date.now() - totalStartTime) / 1000).toFixed(1);
        const correctCount = sessionResults.filter(r => r.isCorrect).length;
        
        document.getElementById('participant-greeting').innerText = `${participantName}, ваш результат: ${correctCount} из ${sessionResults.length} верно`;
        document.getElementById('total-time-text').innerText = `Общее время прохождения: ${totalTimeSec} сек.`;

        const tbody = document.getElementById('results-table-body');
        tbody.innerHTML = '';

        sessionResults.forEach((res, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>Q${index + 1}</td>
                <td style="text-align:left;">${res.question}</td>
                <td>${res.isCorrect ? '<span class="badge-green">✓ Верно</span>' : '<span class="badge-red">✕ Неверно</span>'}</td>
                <td>${res.time}с</td>
            `;
            tbody.appendChild(tr);
        });

        // Опционально: сохраняем отчет в общую историю браузера для организатора
        let allReports = JSON.parse(localStorage.getItem('quiz_reports')) || [];
        allReports.push({
            name: participantName,
            quizTitle: quizzes[currentQuizIndex].title,
            score: `${correctCount}/${sessionResults.length}`,
            totalTime: `${totalTimeSec}с`,
            date: new Date().toLocaleString(),
            details: sessionResults
        });
        localStorage.setItem('quiz_reports', JSON.stringify(allReports));
    }

    renderQuizList();
</script>

</body>
</html>
